# nginx as a plain HTTP/1.1 reverse proxy in front of the gateway (issue #44 evidence).
# Deliberately a common, minimal reverse-proxy configuration with NO framing hardening added:
# the evidence records what the default parser and proxy behavior do, not what a tuned one could.
# Everything logs to stderr (one ordered stream) so the orchestrator can slice it per case with
# the /__sentinel/ requests.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 64;
}

http {
    access_log /dev/stderr;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;

        location /__sentinel/ {
            return 204;
        }

        location / {
            proxy_pass http://gateway:8787;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
