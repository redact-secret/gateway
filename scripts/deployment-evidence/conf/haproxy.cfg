# HAProxy as a plain HTTP/1.1 reverse proxy in front of the gateway (issue #44 evidence).
# Defaults only, no framing hardening added. Logs to stdout (one ordered stream) so the
# orchestrator can slice it per case with the /__sentinel/ requests.
global
    log stdout format raw local0
    maxconn 64

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 15s
    timeout server 15s

frontend fe
    bind :8081
    http-request return status 204 if { path_beg /__sentinel/ }
    default_backend gw

backend gw
    server gw gateway:8787
