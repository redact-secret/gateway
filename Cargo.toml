[package]
name = "redact-secret-gateway"
version = "0.1.0-alpha.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "RedactSecret Gateway: HTTP deployment and protocol boundary (private binary, unreleased)"
publish = false

# The library target exists only so the binary and the API-boundary tests share one
# crate. It is not a published or supported API (ADR 0001, ADR 0011).
[lib]
name = "redact_secret_gateway"
path = "src/lib.rs"

[[bin]]
name = "redact-secret-gateway"
path = "src/main.rs"

[dependencies]
# Exact core pin; see docs/decisions/0011-dependency-and-toolchain-selection.md.
redact-secret = "=0.1.0-beta.12"
tokio = { version = "1", default-features = false, features = ["sync", "net", "rt", "signal", "macros", "time"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Body trait for the permit-holding response body (#20). Already in the graph through axum;
# pinned exactly, no features exist.
http-body = "=1.1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
# Constant-time comparison of the local caller token (#63, ADR 0030). Already in the graph
# through the TLS stack; promoted to a direct exact pin under the ADR 0011 policy.
subtle = { version = "=2.6.1", default-features = false }
serde = { version = "1", default-features = false, features = ["std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
trybuild = "1"
# Test-only TLS fake for upstream-destination tests (#23, ADR 0013). Exact pins; the
# normal build graph is unchanged. Both reuse the aws-lc-rs provider already in the lock.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
# Untrusted-input code must not panic: typed errors only (CONVENTIONS.md).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
dbg_macro = "deny"
