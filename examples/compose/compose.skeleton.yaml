# SKELETON Docker Compose example (issue #7). Not a working proxy.
#
# The skeleton image serves /healthz and /readyz and rejects every other route locally.
# Chat Completions proxying arrives with the Alpha 1 MVP (#8). Nothing here is published:
# there is no registry image yet, so build the local candidate image first:
#
#   cargo build --locked --release
#   sh scripts/build-image.sh target/release/redact-secret-gateway redact-secret-gateway:candidate
#   docker compose -f examples/compose/compose.skeleton.yaml up
#
# (build-image.sh needs a Linux x86_64 binary; on other hosts take the candidate binary
# from the workflow artifact `skeleton-candidate-<sha>`.)
#
# Boundary: one application, one gateway. The port is published to host loopback only.
# Do not change 127.0.0.1 to 0.0.0.0 or publish the port beyond the application that
# uses it: that is outside the supported model (ADR 0009). No credentials, env vars,
# volumes, or secrets are used.
services:
  gateway:
    image: redact-secret-gateway:candidate # local name; registry/name to be selected
    pull_policy: never
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"
