# Alpha 1 release-candidate build (issues #7 and #22, ADR 0012).
#
# The candidate is the Alpha 1 MVP: health endpoints plus the Chat Completions text-subset
# proxy (JSON and SSE relay). This workflow builds each candidate artifact ONCE from the
# candidate commit with `cargo build --locked --release` (no features, no cfg), smoke-tests
# those exact bytes on their own platform (startup, config validation, health, proxy-route
# rejections that never forward, the seam-absence check, and for the image: non-root, read-only,
# the Compose example), and records a manifest with the source, toolchain, core, config, and SDK
# pins and checksums.
#
# It does NOT publish, create a release, push to any registry, sign, generate an SBOM, or
# produce provenance. It uses no secrets and no registry credentials. Artifacts are plain
# workflow artifacts for inspection; distribution is gated (ADR 0010, README "Release
# gating"). The manifest says `distributable: false`.
name: Candidate artifacts (Alpha 1, unpublished)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/artifacts.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "src/**"
      - "container/**"
      - "scripts/**"
      - "examples/config*.json"
      - "examples/compose/**"
      - "examples/node/package-lock.json"
      - "examples/python/requirements.txt"
  workflow_dispatch:

# Deny everything by default; each job re-grants the minimum it needs.
permissions: {}

concurrency:
  group: artifacts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  RUST_BACKTRACE: "0"
  # Reproducibility aid, not a verified claim: strip the checkout path from the binary.
  RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build"

jobs:
  linux-x86_64:
    name: Build and smoke (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build once (x86_64-unknown-linux-gnu, --locked --release)
        id: build
        run: |
          set -eu
          cargo build --locked --release
          mkdir -p stage
          cp target/release/redact-secret-gateway stage/redact-secret-gateway-x86_64-unknown-linux-gnu
          sha="$(sha256sum stage/redact-secret-gateway-x86_64-unknown-linux-gnu | cut -d ' ' -f 1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "candidate sha256: $sha"
      - name: Smoke-test the candidate bytes on this platform
        run: |
          set -eu
          mkdir -p stage/evidence/linux-x86_64
          rustc -vV > stage/evidence/linux-x86_64/rustc.txt
          sh scripts/smoke-binary.sh stage/redact-secret-gateway-x86_64-unknown-linux-gnu \
            examples/config.openai.json stage/evidence/linux-x86_64
      - name: Confirm the tested file is unchanged
        env:
          WANT: ${{ steps.build.outputs.sha256 }}
        run: |
          set -eu
          got="$(sha256sum stage/redact-secret-gateway-x86_64-unknown-linux-gnu | cut -d ' ' -f 1)"
          test "$got" = "$WANT"
      - name: Upload candidate binary and smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-linux-x86_64
          path: stage/
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    name: Build and smoke (macOS ARM64)
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Confirm the runner is Apple silicon
        run: |
          set -eu
          test "$(uname -m)" = arm64
          rustc -vV | grep -q '^host: aarch64-apple-darwin$'
      - name: Build once (aarch64-apple-darwin, --locked --release)
        id: build
        run: |
          set -eu
          cargo build --locked --release
          mkdir -p stage
          cp target/release/redact-secret-gateway stage/redact-secret-gateway-aarch64-apple-darwin
          sha="$(shasum -a 256 stage/redact-secret-gateway-aarch64-apple-darwin | cut -d ' ' -f 1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "candidate sha256: $sha"
      - name: Smoke-test the candidate bytes on this platform
        run: |
          set -eu
          mkdir -p stage/evidence/macos-arm64
          rustc -vV > stage/evidence/macos-arm64/rustc.txt
          sh scripts/smoke-binary.sh stage/redact-secret-gateway-aarch64-apple-darwin \
            examples/config.openai.json stage/evidence/macos-arm64
      - name: Confirm the tested file is unchanged
        env:
          WANT: ${{ steps.build.outputs.sha256 }}
        run: |
          set -eu
          got="$(shasum -a 256 stage/redact-secret-gateway-aarch64-apple-darwin | cut -d ' ' -f 1)"
          test "$got" = "$WANT"
      - name: Upload candidate binary and smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-macos-arm64
          path: stage/
          if-no-files-found: error
          retention-days: 7

  image-linux-amd64:
    name: Image from the Linux binary (linux/amd64)
    needs: [linux-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the candidate Linux binary (no rebuild)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: stage-linux-x86_64
          path: in
      - name: Verify the downloaded bytes are the built bytes
        env:
          WANT: ${{ needs.linux-x86_64.outputs.sha256 }}
        run: |
          set -eu
          got="$(sha256sum in/redact-secret-gateway-x86_64-unknown-linux-gnu | cut -d ' ' -f 1)"
          echo "downloaded sha256: $got"
          test "$got" = "$WANT"
      - name: Build the candidate image from that binary (local name, not pushed)
        run: sh scripts/build-image.sh in/redact-secret-gateway-x86_64-unknown-linux-gnu redact-secret-gateway:candidate
      - name: Smoke-test the image (non-root, read-only, loopback-published)
        env:
          WANT: ${{ needs.linux-x86_64.outputs.sha256 }}
        run: sh scripts/smoke-image.sh redact-secret-gateway:candidate "$WANT" stage/evidence/image-linux-amd64
      - name: Smoke-test the Compose example against the candidate image
        run: sh scripts/smoke-compose.sh examples/compose/compose.yaml stage/evidence/compose-linux-amd64
      - name: Save the image and record its identity
        env:
          WANT: ${{ needs.linux-x86_64.outputs.sha256 }}
        run: |
          set -eu
          docker save redact-secret-gateway:candidate -o stage/redact-secret-gateway-candidate-image-linux-amd64.tar
          base="$(awk '/^FROM / {print $2; exit}' container/Dockerfile)"
          jq -n -S --arg image_id "$(docker inspect --format '{{.Id}}' redact-secret-gateway:candidate)" \
            --arg ref "redact-secret-gateway:candidate" --arg base "$base" --arg bin "$WANT" \
            --arg user "$(docker inspect --format '{{.Config.User}}' redact-secret-gateway:candidate)" \
            '{local_ref:$ref, image_id:$image_id, base_image_pinned:$base, base_image_platform:"linux/amd64", runtime_user:$user, contains_binary_sha256:$bin}' \
            > stage/image-info.json
          cat stage/image-info.json
      - name: Upload image archive and smoke evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-image-linux-amd64
          path: stage/
          if-no-files-found: error
          retention-days: 7

  manifest:
    name: Candidate manifest and checksums
    needs: [linux-x86_64, macos-arm64, image-linux-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Download every candidate stage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stage-*
          merge-multiple: true
          path: bundle
      - name: Verify the bytes match what each job built and tested
        env:
          LINUX: ${{ needs.linux-x86_64.outputs.sha256 }}
          MACOS: ${{ needs.macos-arm64.outputs.sha256 }}
        run: |
          set -eu
          test "$(sha256sum bundle/redact-secret-gateway-x86_64-unknown-linux-gnu | cut -d ' ' -f 1)" = "$LINUX"
          test "$(sha256sum bundle/redact-secret-gateway-aarch64-apple-darwin | cut -d ' ' -f 1)" = "$MACOS"
          test "$(jq -r .contains_binary_sha256 bundle/image-info.json)" = "$LINUX"
      - name: Generate manifest.json and SHA256SUMS
        run: sh scripts/candidate-manifest.sh bundle
      - name: Verify SHA256SUMS
        run: |
          set -eu
          cd bundle
          sha256sum -c SHA256SUMS
      - name: Check the manifest states the truth (not distributable, proxy capability, pins)
        run: |
          set -eu
          jq -e '.distributable == false
            and .status == "alpha1-release-candidate-unpublished"
            and (.capabilities.proxy.endpoints | map(.endpoint) == ["POST /v1/chat/completions", "POST /v1/responses"])
            and (.capabilities.proxy.response_redaction == false)
            and (.distribution_blockers | length) >= 4
            and (.core.pin == "=0.1.0-beta.12")
            and (.sdk_pins.node.version | length) > 0
            and (.sdk_pins.python.version | length) > 0
            and (.artifacts | length) == 3
            and (.signing == "not produced" and .sbom == "not produced" and .provenance == "not produced")' \
            bundle/manifest.json
      - name: Show the manifest and checksums
        run: |
          set -eu
          {
            echo '## Alpha 1 release candidate (not published)'
            echo
            echo 'Signing, SBOM, and provenance: not produced. Not distributable (ADR 0010, manifest distribution_blockers).'
            echo
            echo '```json'
            cat bundle/manifest.json
            echo '```'
            echo
            echo '```text'
            cat bundle/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat bundle/manifest.json
          cat bundle/SHA256SUMS
      - name: Upload the candidate bundle (binaries, image archive, manifest, checksums, evidence)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alpha1-candidate-${{ github.sha }}
          path: bundle/
          if-no-files-found: error
          retention-days: 14
