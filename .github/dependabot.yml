version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # The core is pinned exactly and upgraded only as an explicit qualification change
      # (CONVENTIONS.md, ADR 0011). Never auto-follow core beta releases.
      - dependency-name: "redact-secret"
